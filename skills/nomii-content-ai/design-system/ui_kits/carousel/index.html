<!-- @dsCard group="Carousel" viewport="1120x760" name="Carousel Viewer" subtitle="Full NOMII Instagram carousel, click through the laminas" -->
<!-- @startingPoint section="Carousel" subtitle="Instagram carousel scaffold (1080×1440 laminas)" viewport="1120x760" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOMII · Carousel</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
html,body{margin:0}
body{background:#eceef0;font-family:var(--font-brand);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:36px}
.viewer{display:flex;flex-direction:column;align-items:center;gap:22px}
.stage{position:relative;width:460px;height:613px;border-radius:26px;overflow:hidden;box-shadow:0 30px 80px rgba(16,69,116,.22);background:#fff}
.scaler{position:absolute;top:0;left:0;transform-origin:top left;transform:scale(.42592)}
.nav{display:flex;align-items:center;gap:22px}
.arrow{width:52px;height:52px;border-radius:999px;border:none;background:#fff;box-shadow:var(--shadow-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--nomii-azul);transition:transform .15s ease,background .15s ease}
.arrow:hover{background:var(--nomii-celeste);color:#fff}
.arrow:active{transform:scale(.92)}
.arrow:disabled{opacity:.35;cursor:default;background:#fff;color:var(--nomii-azul)}
.dots{display:flex;gap:9px}
.dot{width:9px;height:9px;border-radius:999px;background:#c7ccd1;border:none;padding:0;cursor:pointer;transition:width .2s ease,background .2s ease}
.dot.on{width:26px;background:var(--nomii-celeste)}
.count{font-weight:300;font-size:14px;color:#7c8790;letter-spacing:.06em}
</style></head>
<body><div id="root"></div>
<script src="Lamina.jsx" type="text/babel"></script>
<script src="CoverSlide.jsx" type="text/babel"></script>
<script src="ChatSlide.jsx" type="text/babel"></script>
<script src="FiftyFiftySlide.jsx" type="text/babel"></script>
<script src="CardTextSlide.jsx" type="text/babel"></script>
<script src="PopoutSlide.jsx" type="text/babel"></script>
<script src="FlatPauseSlide.jsx" type="text/babel"></script>
<script src="CtaSlide.jsx" type="text/babel"></script>
<script type="text/babel" data-presets="react">
const { useState } = React;
const A = "../../assets";

const laminas = [
  <CoverSlide image={`${A}/banco/banco-2.jpg`} pill="4 de cada 5 médicos" title="no quedan en el ENARM" caption="(no lo decimos nosotros, lo dicen las estadísticas)" />,
  <ChatSlide lead="Y probablemente te preguntas" bubbles={["¿Qué hago entonces?","¿Lo sigo intentando?","¿O asumo que nunca me podré especializar?"]} />,
  <FiftyFiftySlide image={`${A}/banco/banco-7.jpg`} lines={[
    [{text:"Porque volver a intentar el ENARM "},{text:"es comprometer otro año completo",style:"medium"}],
    [{text:"Por eso, hay que ser estratégicos",style:"italic"}],
  ]} />,
  <FiftyFiftySlide imagePosition="bottom" image={`${A}/banco/banco-9.jpg`} lines={[
    [{text:"Porque… seguir en un camino que no depende completamente de ti, "},{text:"te obliga a esperar y no llegar a tu objetivo",style:"italic"}],
  ]} />,
  <CardTextSlide image={`${A}/banco/banco-8.jpg`} heading="Pero cuando entras al sistema:" items={[{label:"No tienes el",emphasis:"tiempo suficiente"},{label:"No tienes los",emphasis:"recursos"},{label:"No tienes las",emphasis:"condiciones"}]} />,
  <PopoutSlide image={`${A}/banco/banco-12.jpg`} title="Alemania es uno de esos entornos" chips={["Top 3 en innovación en salud","Centros clínicos de nivel internacional","Alta demanda de médicos"]} />,
  <FlatPauseSlide text={"Hay un camino donde sí puedes\navanzar con mayor claridad y control"} bg="var(--nomii-azul)" />,
  <CtaSlide text="Revisa nuestro perfil y entiende cómo funciona este camino" cta="Conócelo en este link" />,
];

function Viewer(){
  const [i,setI] = useState(0);
  const n = laminas.length;
  return (
    <div className="viewer">
      <div className="stage"><div className="scaler">{laminas[i]}</div></div>
      <div className="nav">
        <button className="arrow" disabled={i===0} onClick={()=>setI(v=>Math.max(0,v-1))} aria-label="Anterior">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
        </button>
        <div className="dots">{laminas.map((_,k)=>(<button key={k} className={"dot"+(k===i?" on":"")} onClick={()=>setI(k)} aria-label={`Lámina ${k+1}`}/>))}</div>
        <button className="arrow" disabled={i===n-1} onClick={()=>setI(v=>Math.min(n-1,v+1))} aria-label="Siguiente">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
        </button>
      </div>
      <div className="count">{i+1} / {n}</div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Viewer/>);
</script></body></html>
