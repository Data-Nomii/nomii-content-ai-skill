<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
html,body{margin:0}body{font-family:var(--font-brand);padding:20px;background:#fff}
.row{display:flex;gap:14px}
.card{flex:1;border-radius:14px;padding:22px;box-shadow:var(--shadow-soft)}
.t{font-weight:500;font-size:22px;line-height:1.2}
.s{font-weight:300;font-size:15px;margin-top:6px}
</style></head><body>
<div class="row">
<div class="card" style="background:#F8F8F8"><div class="t" style="color:#3C3C3B">Gris oscuro</div><div class="s" style="color:#3C3C3B">sobre gris claro</div></div>
<div class="card" style="background:#77BFD0"><div class="t" style="color:#fff">Blanco</div><div class="s" style="color:#fff">sobre celeste</div></div>
<div class="card" style="background:#104574"><div class="t" style="color:#fff">Blanco</div><div class="s" style="color:#fff">sobre azul</div></div>
<div class="card" style="background:#fff;border:1px solid #eee"><div class="t" style="color:#77BFD0">Celeste</div><div class="s" style="color:#3C3C3B">acento sobre blanco</div></div>
</div>
</body></html>
