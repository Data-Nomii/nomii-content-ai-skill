<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
html,body{margin:0}body{font-family:var(--font-brand);display:flex}
.cell{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
.cell img{max-width:150px;max-height:70px;width:auto;height:auto}
.iso{max-width:64px!important;max-height:64px!important}
.light{background:#F8F8F8}.accent{background:#77BFD0}.dark{background:#104574}
.cap{font-weight:300;font-size:12px;color:#8a8a89}
.accent .cap,.dark .cap{color:rgba(255,255,255,.8)}
.circle{width:88px;height:88px;border-radius:999px;background:#fff;display:flex;align-items:center;justify-content:center}
</style></head><body>
<div class="cell light"><img src="../assets/logo-azul.png" alt="logo azul"><div class="cap">Logo · azul / fondo claro</div></div>
<div class="cell accent"><img src="../assets/logo-blanco.png" alt="logo blanco"><div class="cap">Logo · blanco / fondo color</div></div>
<div class="cell dark"><div class="circle"><img class="iso" src="../assets/isotipo-celeste.png" alt="isotipo"></div><div class="cap">Isotipo · CTA circular</div></div>
</body></html>
