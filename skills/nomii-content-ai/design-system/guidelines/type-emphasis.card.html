<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
html,body{margin:0}body{font-family:var(--font-brand);background:#F8F8F8;padding:34px;color:#3C3C3B}
p{margin:0;font-weight:300;font-size:30px;line-height:1.4;max-width:560px}
.m{font-weight:500}
.i{font-weight:500;font-style:italic;color:#77BFD0}
</style></head><body>
<p>Porque volver a intentar el ENARM <span class="m">es comprometer otro año completo</span>. <span class="i">Por eso, hay que ser estratégicos.</span></p>
</body></html>
