<!-- @dsCard group="Colors" viewport="700x120" name="Celeste Tints" subtitle="Supporting tints derived from the primary accent" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
html,body{margin:0}body{font-family:var(--font-brand);background:#fff;padding:20px}
.row{display:flex;gap:14px}
.sw{flex:1;border-radius:12px;overflow:hidden;box-shadow:var(--shadow-soft)}
.chip{height:54px}
.meta{padding:8px 10px}
.name{font-weight:500;font-size:13px;color:var(--nomii-gris-oscuro)}
.hex{font-weight:300;font-size:12px;color:#8a8a89}
</style></head><body>
<div class="row">
<div class="sw"><div class="chip" style="background:#e4f2f6"></div><div class="meta"><div class="name">celeste-100</div><div class="hex">#E4F2F6</div></div></div>
<div class="sw"><div class="chip" style="background:#a9d6e1"></div><div class="meta"><div class="name">celeste-300</div><div class="hex">#A9D6E1</div></div></div>
<div class="sw"><div class="chip" style="background:#5aa9bc"></div><div class="meta"><div class="name">celeste-600</div><div class="hex">#5AA9BC</div></div></div>
<div class="sw"><div class="chip" style="background:#0d3a63"></div><div class="meta"><div class="name">azul-600</div><div class="hex">#0D3A63</div></div></div>
</div>
</body></html>
