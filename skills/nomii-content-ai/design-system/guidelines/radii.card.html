<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
html,body{margin:0}body{font-family:var(--font-brand);background:#F8F8F8;padding:26px;display:flex;gap:26px;align-items:center}
.box{background:#fff;display:flex;align-items:center;justify-content:center;font-weight:300;font-size:14px;color:#3C3C3B}
.pill{width:150px;height:56px;border-radius:999px;box-shadow:var(--shadow-pill)}
.card{width:150px;height:96px;border-radius:36px;box-shadow:var(--shadow-card)}
.soft{width:150px;height:96px;border-radius:20px;box-shadow:var(--shadow-soft)}
</style></head><body>
<div class="box pill">radius-pill · 999</div>
<div class="box card">radius-card · 36</div>
<div class="box soft">radius-md · 20</div>
</body></html>
