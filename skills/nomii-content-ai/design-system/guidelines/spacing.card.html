<!-- @dsCard group="Foundations" viewport="700x150" name="Spacing Scale" subtitle="8-based rhythm: space-1 … space-7" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
html,body{margin:0}body{font-family:var(--font-brand);background:#fff;padding:24px;display:flex;gap:18px;align-items:flex-end}
.item{text-align:center}
.bar{background:#77BFD0;border-radius:4px;width:100%}
.b1{height:8px}.b2{height:16px}.b3{height:24px}.b4{height:32px}.b5{height:48px}.b6{height:64px}.b7{height:96px}
.cell{width:70px}
.lbl{font-weight:500;font-size:13px;color:#3C3C3B;margin-top:8px}
.px{font-weight:300;font-size:12px;color:#8a8a89}
</style></head><body>
<div class="cell item"><div class="bar b1"></div><div class="lbl">1</div><div class="px">8</div></div>
<div class="cell item"><div class="bar b2"></div><div class="lbl">2</div><div class="px">16</div></div>
<div class="cell item"><div class="bar b3"></div><div class="lbl">3</div><div class="px">24</div></div>
<div class="cell item"><div class="bar b4"></div><div class="lbl">4</div><div class="px">32</div></div>
<div class="cell item"><div class="bar b5"></div><div class="lbl">5</div><div class="px">48</div></div>
<div class="cell item"><div class="bar b6"></div><div class="lbl">6</div><div class="px">64</div></div>
<div class="cell item"><div class="bar b7"></div><div class="lbl">7</div><div class="px">96</div></div>
</body></html>
