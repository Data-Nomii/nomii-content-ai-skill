<!-- @dsCard group="Colors" viewport="700x150" name="Brand Core" subtitle="The four official NOMII hexes" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
html,body{margin:0}body{font-family:var(--font-brand);background:#fff;padding:20px}
.row{display:flex;gap:14px}
.sw{flex:1;border-radius:14px;overflow:hidden;box-shadow:var(--shadow-soft)}
.chip{height:76px}
.meta{padding:10px 12px}
.name{font-weight:500;font-size:15px;color:var(--nomii-gris-oscuro)}
.hex{font-weight:300;font-size:13px;color:#8a8a89;letter-spacing:.04em}
</style></head><body>
<div class="row">
<div class="sw"><div class="chip" style="background:#77BFD0"></div><div class="meta"><div class="name">Celeste</div><div class="hex">#77BFD0</div></div></div>
<div class="sw"><div class="chip" style="background:#104574"></div><div class="meta"><div class="name">Azul</div><div class="hex">#104574</div></div></div>
<div class="sw"><div class="chip" style="background:#3C3C3B"></div><div class="meta"><div class="name">Gris Oscuro</div><div class="hex">#3C3C3B</div></div></div>
<div class="sw"><div class="chip" style="background:#F8F8F8;border:1px solid #eee"></div><div class="meta"><div class="name">Gris Claro</div><div class="hex">#F8F8F8</div></div></div>
</div>
</body></html>
